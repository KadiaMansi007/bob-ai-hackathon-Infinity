submission:
  title: "Infinity Threat Intelligence Fusion & Prioritisation Platform"  # REQUIRED

  problem_statement: >                         # REQUIRED
    Security Operations Centre (SOC) analysts managing multi-source threat feeds face
    debilitating alert fatigue: hundreds of raw signals per hour arrive from SIEMs, cyber
    sensors, satellite feeds, and intelligence reports, the vast majority of which are false
    positives. The current manual triage process for D2 threat correlation takes 30–90 minutes
    per incident and causes genuine threats to be missed or delayed, directly increasing
    organisational risk.

  solution_summary: >                          # REQUIRED
    We built the Infinity Threat Intelligence Fusion and Prioritisation Platform — a
    full-stack web application that ingests simulated multi-source threat feeds, normalises
    and deduplicates alerts, correlates them into incidents using deterministic rules,
    computes explainable risk scores, maps to MITRE ATT&CK, and surfaces a dual-layer
    analyst dashboard. IBM Bob is integrated as an AI reasoning layer via a custom MCP
    server: it independently classifies each incident as GENUINE_THREAT or FALSE_POSITIVE,
    explains the risk score in natural language, and generates BLUF summaries — all
    grounded solely in pipeline-produced evidence.

  key_features:                                # REQUIRED
    - "Multi-source feed ingestion and normalisation pipeline with fingerprint-based deduplication"
    - "Deterministic correlation engine (rules C0–C5) producing auditable incident records with auto_classification (GENUINE_THREAT | FALSE_POSITIVE | UNCLASSIFIED)"
    - "Explainable risk scoring with per-component breakdown (severity, confidence, recency, source reliability, MITRE coverage) stored and displayed separately"
    - "IBM Bob AI review layer via custom MCP server: independent threat classification, risk score explanation, correlation rule review, and BLUF summary generation — with agreement_status tracking"
    - "React analyst dashboard showing deterministic pipeline decisions and Bob AI assessment side-by-side, with MITRE ATT&CK tactic/technique mapping"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "SQLAlchemy", "Pydantic", "Vite", "TailwindCSS"]
    ibm_technologies: ["IBM Bob"]
    databases: ["SQLite"]
    other: ["Docker", "Docker Compose", "GitHub Actions", "MCP (Model Context Protocol)"]

  what_we_are_most_proud_of: >
    The dual-layer architecture that keeps the deterministic pipeline and IBM Bob AI
    reasoning completely separate. Every risk score, correlation rule firing, and
    auto-classification is computed without AI, making it fully auditable. Bob then
    acts as an independent reviewer — it can agree or disagree with the pipeline's
    classification — and the agreement_status field surfaces those disagreements as
    analytical signals in the dashboard rather than hiding them.

  known_limitations: >
    All threat feeds are synthetic and simulated — no real external feed APIs are
    connected. Authentication is a stub JWT (not production-ready). The application
    is designed for local/Docker deployment only and has not been tested for horizontal
    scaling. Bob analysis requires a valid IBM Bob API key; without it the deterministic
    pipeline still runs fully but the AI review layer is disabled.

